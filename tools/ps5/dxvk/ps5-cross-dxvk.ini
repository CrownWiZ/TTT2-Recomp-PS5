# PS5 cross file for DXVK-native (display WSI). Models the RADV cross: both
# compilers are the SDK's own wrappers (they bake in -target x86_64-sie-ps5,
# the sysroot, libc++ via -stdlib++-isystem, -femulated-tls and the
# prospero-lld PATH). The SDK ships no Vulkan headers, so they come from the
# Mesa tree (1.4, matching the RADV the port links). system=linux gives the
# code paths the M2 Linux build validated; the console CPU is x86-64.

[binaries]
c = sdk / 'bin/prospero-clang'
cpp = sdk / 'bin/prospero-clang++'
ar = sdk / 'bin/prospero-ar'
strip = sdk / 'bin/prospero-strip'
pkg-config = sdk / 'bin/prospero-pkg-config'

[constants]
sdk = '/root/m4/native/ps5-payload-sdk-mihawk'
stubs = '/root/m4/dxvk-stubs'
mesainc = '/mnt/c/ttt2/.superpowers/m4-downloads/PS5_Mesa/include'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'ps5'
endian = 'little'

[built-in options]
default_library = 'static'
b_ndebug = 'true'
cpp_args = ['-isystem', mesainc]
cpp_link_args = ['-L', stubs]

[properties]
needs_exe_wrapper = true
